<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Grub RAPID - Regla de 20</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="wake-status" id="wakeStatus">🔒 Pantalla encendida continuamente</div>

        <!-- Círculo de Viento Responsive -->
        <div class="canvas-wrapper">
            <canvas id="windCanvas"></canvas>
        </div>

        <!-- Panel de Entradas de Datos -->
        <div class="controls-grid">
            <div class="input-box">
                <label for="distancia">DISTANCIA (0-25)</label>
                <input type="number" id="distancia" placeholder="10" min="0" max="25" inputmode="numeric">
            </div>
            <div class="input-box">
                <label for="viento">VIENTO</label>
                <input type="number" id="viento" placeholder="0" min="0" max="60" inputmode="numeric">
            </div>
            <button id="reset-button">RESET</button>
        </div>

        <!-- PANEL DE RESPUESTAS EN TIEMPO REAL -->
        <div class="results-box">
            <div class="res-card">
                <div class="res-title">PONER ÁNGULO</div>
                <div class="res-value" id="dispAngle">--°</div>
            </div>
            <div class="res-card">
                <div class="res-title">BARRA FUERZA</div>
                <div class="res-value" id="dispPower">--</div>
            </div>
        </div>

        <!-- Imágenes de Referencia -->
        <div class="bottom-image">
            <img src="https://i.postimg.cc/cJkpMPBM/REGLA-20.png" alt="REGLA 20">
        </div>
        <div class="bottom-image">
            <img src="https://raw.githubusercontent.com/cobyzero8/kaymi/refs/heads/main/VALORES%20REGLA%2020.png" alt="Valores Regla 20">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
